name: Refresh fnOS Version Manifest

on:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * *'

permissions:
  actions: write
  contents: write

concurrency:
  group: refresh-fnos-version-manifest
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read downloadable Web UI releases
        id: webui
        env:
          WEBUI_RELEASE_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          webui_versions_json="$(gh release list --repo "${WEBUI_RELEASE_REPO}" --limit 100 --json tagName --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | sub("^v"; "")]')"
          echo "webui_versions_json=${webui_versions_json}" >> "$GITHUB_OUTPUT"
          echo "Downloadable fnOS Web UI releases: ${webui_versions_json}"

      - name: Read upstream runtime releases
        id: runtime
        env:
          UPSTREAM_REPO: EKKOLearnAI/hermes-studio
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_versions_json="$(gh release list --repo "${UPSTREAM_REPO}" --limit 100 --json tagName --jq '[.[].tagName | select(test("^hermes-[0-9]+\\.[0-9]+\\.[0-9]+-runtime$")) | sub("^hermes-"; "") | sub("-runtime$"; "")]')"
          echo "runtime_versions_json=${runtime_versions_json}" >> "$GITHUB_OUTPUT"
          echo "Runtime releases: ${runtime_versions_json}"

      - name: Update fnOS version manifest
        env:
          WEBUI_VERSIONS_JSON: ${{ steps.webui.outputs.webui_versions_json }}
          RUNTIME_VERSIONS_JSON: ${{ steps.runtime.outputs.runtime_versions_json }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/sync-fnos-version-manifest.mjs

      - name: Commit and push manifest
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- fnos/hermes-studio/webui-versions.json; then
            git add fnos/hermes-studio/webui-versions.json
            git commit -m "chore(fnos): refresh Hermes version manifest"
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge fnOS version manifest CDN
        if: steps.push.outputs.pushed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/fnos/hermes-studio/webui-versions.json"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## fnOS version manifest"
            echo ""
            echo "- Pushed: ${{ steps.push.outputs.pushed || 'false' }}"
            echo "- Downloadable Web UI versions: ${{ steps.webui.outputs.webui_versions_json }}"
            echo "- Runtime versions: ${{ steps.runtime.outputs.runtime_versions_json }}"
            echo "- Source merge: disabled for scheduled runs. Native fnOS shell releases are versioned separately."
            echo "- Web UI artifact build: use webui-release.yml manually after a compatible source sync."
          } >> "$GITHUB_STEP_SUMMARY"
